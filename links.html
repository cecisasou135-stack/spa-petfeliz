<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spa PetFeliz · Links</title>
<meta name="description" content="Hotel, creche e banho & tosa em Anápolis. Fale com a gente no WhatsApp, veja como chegar e conheça nossos serviços.">
<meta name="theme-color" content="#FFF7F2">
<link rel="icon" href="imagens/logo-petfeliz.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  body{min-height:100vh;min-height:100dvh}
  .bio{max-width:440px;margin:0 auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}

  .bio-logo{background:#fff;border-radius:26px;padding:16px 22px;box-shadow:0 2px 0 var(--line);display:flex;justify-content:center}
  .bio-logo img{width:100%;max-width:300px;height:auto}

  .bio-hero{background:var(--pink);border-radius:30px;overflow:hidden;padding:12px 12px 22px}
  .bio-hero .copy{padding:10px 12px 0;display:flex;flex-direction:column;gap:8px}
  .bio-hero h1{margin:0;font:800 26px/1.08 var(--f-display);color:#fff;text-wrap:pretty}
  .bio-hero .place{font:700 14px var(--f-body);color:var(--pink-soft)}

  .links{display:flex;flex-direction:column;gap:12px;margin-top:4px}
  .link{display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 18px 10px 10px;border-radius:999px;
    text-decoration:none;font:800 17px var(--f-body);transition:transform .1s,box-shadow .1s,filter .15s}
  .link .ic{width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;flex:none}
  .link .lbl{flex:1;min-width:0}
  .link .chev{font:800 22px var(--f-body)}
  .link:active{transform:translateY(2px)}

  .link{background:#fff;color:var(--brown);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
  .link .ic{background:var(--pink-soft);color:var(--pink);fill:var(--pink)}
  .link .chev{color:var(--pink)}
  .link:hover{color:var(--brown);border-color:#E6C9BC}
  .link:active{box-shadow:0 2px 0 var(--line)}

  .bio-foot{margin-top:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bio-foot .paws{display:flex;gap:8px;fill:var(--pink-dash)}
  .credit{margin-top:14px;font:600 12px var(--f-body);color:var(--muted-2)}
</style>
</head>
<body>
<main class="bio">

  <div class="bio-logo"><img src="imagens/logo-petfeliz.png" alt="Spa PetFeliz · Seu pet é tratado como nosso"></div>

  <div class="bio-hero">
    <div class="copy">
      <h1>Hotel, creche e banho &amp; tosa com muito carinho.</h1>
      <div class="place">Anápolis · GO</div>
    </div>
  </div>

  <nav class="links" aria-label="Links">
    <a class="link svc" href="./">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><use href="#paw"/></svg></span>
      <span class="lbl">Conheça nossos serviços</span><span class="chev">›</span>
    </a>
    <a class="link wa" href="https://wa.me/5562995766247" target="_blank" rel="noopener">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5z"/><path d="M9 9.5c0 2.8 2.2 5 5 5l1.2-1.3-1.8-.9-.8.8a3.5 3.5 0 0 1-2.2-2.2l.8-.8-.9-1.8z" fill="currentColor" stroke-width="1"/></svg></span>
      <span class="lbl">WhatsApp</span><span class="chev">›</span>
    </a>
    <a class="link map" href="https://maps.app.goo.gl/YtmfcxasR3pHiqQA6?g_st=ic" target="_blank" rel="noopener">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span>
      <span class="lbl">Localização</span><span class="chev">›</span>
    </a>
  </nav>

  <footer class="bio-foot">
    <div class="paws">
      <svg width="16" height="16" viewBox="0 0 24 24"><use href="#paw"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24"><use href="#paw"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24"><use href="#paw"/></svg>
    </div>
    <div class="script pink">Seu pet merece cuidado e carinho!</div>
    <div class="credit">Desenvolvido por CêSitez</div>
  </footer>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="paw" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="5.5" cy="10" r="2.2"/><circle cx="9.5" cy="5.8" r="2.3"/><circle cx="14.5" cy="5.8" r="2.3"/><circle cx="18.5" cy="10" r="2.2"/></symbol>
</svg>
</body>
</html>
